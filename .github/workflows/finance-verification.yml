name: Finance verification

on:
  push:
    branches:
      - codex/finance-3-1-linked-payments
  pull_request:
    branches:
      - codex/finance-3-1-linked-payments
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Finance tests
        run: npm run test:finance
